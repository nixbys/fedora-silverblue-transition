# Secret scanning
#
# GitHub's native secret scanning + push protection are already enabled on
# this repo (provider-pattern based: recognized token formats for known
# services). This job is a supplement, not a replacement: it runs gitleaks,
# which also flags generic high-entropy strings and repo-specific patterns
# that provider-pattern matching won't catch -- useful here since this repo
# ships a local web server (control-panel/server.py) that mints its own
# per-run auth tokens, plus assorted shell/Containerfile config, any of
# which could accidentally hardcode something real during future edits.
#
# It runs the official gitleaks BINARY directly (pinned to an exact version
# and verified against the project's published SHA-256 checksum) rather than
# the gitleaks GitHub Action, which asks for a paid license outside of
# public/open-source repos. The binary is free and behaves identically.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Start with zero permissions; the single job opts back in to read-only.
permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so a secret committed earlier (and later deleted)
          # is still caught -- deletion does not remove it from Git.
          fetch-depth: 0
          persist-credentials: false

      # Pinned version + checksum so a tampered release binary cannot run
      # here. Bump VERSION/SHA256 together; the checksum comes from the
      # matching gitleaks_<version>_checksums.txt on the GitHub release.
      - name: Run gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          # Scan the whole history. Findings print to the log and fail the job.
          ./gitleaks git --no-banner --redact --verbose .
